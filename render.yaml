databases:
  - name: biblioteca-db
    databaseName: biblioteca
    user: biblioteca
    plan: free

services:
  - type: web
    name: biblioteca
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn gestor.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
